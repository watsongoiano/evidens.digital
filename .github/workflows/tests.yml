name: Testes

# Roda a suíte em todo push e em todo pull request. Os testes cobrem os
# controles de segurança clínica descritos em docs/registro-de-perigos.md;
# um pull request com teste falhando não deve ser mesclado.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest

  css:
    # static/evidens.css é gerado a partir de static/evidens.src.css e
    # tailwind.config.js. Este passo falha se o arquivo publicado não
    # corresponder às páginas atuais (ex.: classe nova sem recompilar).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Recompilar o CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i static/evidens.src.css -o static/evidens.css --minify

      - name: Conferir que o CSS publicado está atualizado
        run: git diff --exit-code static/evidens.css
