name: Testes

# Roda a suíte em todo push e em todo pull request. Os testes cobrem os
# controles de segurança clínica descritos em docs/registro-de-perigos.md;
# um pull request com teste falhando não deve ser mesclado.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest
